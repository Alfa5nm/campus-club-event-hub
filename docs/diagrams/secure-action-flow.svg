<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc"><title id="title">Secure action flow</title><desc id="desc">A form or AJAX action passes method, session, CSRF, authorization, business rules, database transaction and confirmed UI update gates.</desc><defs><style>.b{stroke:#17212b;stroke-width:3;rx:16}.h{font:700 21px Arial;fill:#17212b}.s{font:400 16px Arial;fill:#46515a}.n{font:700 18px Arial;fill:#fff}.l{stroke:#17212b;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#17212b"/></marker></defs><rect width="1500" height="650" fill="#f8f1e5"/><text x="60" y="65" class="h">SECURE STATE-CHANGE PIPELINE</text>
<g transform="translate(60 150)"><rect width="210" height="165" fill="#f4b83f" class="b"/><circle cx="35" cy="36" r="22" fill="#17212b"/><text x="29" y="43" class="n">1</text><text x="25" y="92" class="h">Form / AJAX</text><text x="25" y="124" class="s">action + IDs</text><text x="25" y="149" class="s">CSRF token</text></g>
<g transform="translate(330 150)"><rect width="210" height="165" fill="#fffaf2" class="b"/><circle cx="35" cy="36" r="22" fill="#17212b"/><text x="29" y="43" class="n">2</text><text x="25" y="92" class="h">Request gate</text><text x="25" y="124" class="s">POST + session</text><text x="25" y="149" class="s">CSRF match</text></g>
<g transform="translate(600 150)"><rect width="210" height="165" fill="#dce8dc" class="b"/><circle cx="35" cy="36" r="22" fill="#17212b"/><text x="29" y="43" class="n">3</text><text x="25" y="92" class="h">Permission</text><text x="25" y="124" class="s">role + club</text><text x="25" y="149" class="s">ownership check</text></g>
<g transform="translate(870 150)"><rect width="210" height="165" fill="#fffaf2" class="b"/><circle cx="35" cy="36" r="22" fill="#17212b"/><text x="29" y="43" class="n">4</text><text x="25" y="92" class="h">Rules</text><text x="25" y="124" class="s">state, deadline</text><text x="25" y="149" class="s">capacity, values</text></g>
<g transform="translate(1140 150)"><rect width="290" height="165" fill="#ee725d" class="b"/><circle cx="35" cy="36" r="22" fill="#17212b"/><text x="29" y="43" class="n">5</text><text x="25" y="92" class="h">Database commit</text><text x="25" y="124" class="s">prepared SQL</text><text x="25" y="149" class="s">transaction / constraint</text></g>
<path d="M270 232H320M540 232H590M810 232H860M1080 232H1130" class="l"/><path d="M1285 315V430H760V495" class="l"/>
<rect x="560" y="495" width="400" height="100" fill="#17212b" rx="16"/><text x="605" y="538" class="n">Confirmed response</text><text x="605" y="571" style="font:400 17px Arial;fill:#fff">HTML redirect or {ok, message, data}</text><text x="75" y="405" class="s">Any failed gate stops the write and returns a meaningful HTTP error.</text>
</svg>
