<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">CampusHub normalized relational schema</title><desc id="desc">Core users, clubs, memberships, events, registrations, attendance, certificates, announcements, and notifications with uncluttered cardinality labels.</desc>
<defs><style>.box{fill:#fffaf0;stroke:#17212b;stroke-width:3}.head{fill:#17212b}.h{font:700 20px Arial;fill:#fff}.r{font:15px Arial;fill:#17212b}.line{stroke:#52615a;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{font:700 14px Arial;fill:#bd4f3c}.title{font:700 18px Arial;letter-spacing:2px;fill:#bd4f3c}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#52615a"/></marker></defs>
<rect width="1600" height="1000" fill="#f8f1e5"/><text x="55" y="55" class="title">NORMALIZED CORE SCHEMA / PARTICIPATION + ENGAGEMENT</text>
<g transform="translate(55 105)"><rect width="260" height="170" class="box"/><path d="M0 0h260v42H0z" class="head"/><text x="16" y="28" class="h">USERS</text><text x="16" y="70" class="r">PK user_id</text><text x="16" y="98" class="r">UQ email</text><text x="16" y="126" class="r">password_hash</text><text x="16" y="154" class="r">role, status</text></g>
<g transform="translate(405 105)"><rect width="290" height="195" class="box"/><path d="M0 0h290v42H0z" class="head"/><text x="16" y="28" class="h">CLUB_MEMBERSHIP</text><text x="16" y="70" class="r">PK membership_id</text><text x="16" y="98" class="r">FK student_user_id</text><text x="16" y="126" class="r">FK club_id</text><text x="16" y="154" class="r">role, approval</text><text x="16" y="182" class="r">membership status</text></g>
<g transform="translate(790 105)"><rect width="260" height="170" class="box"/><path d="M0 0h260v42H0z" class="head"/><text x="16" y="28" class="h">CLUBS</text><text x="16" y="70" class="r">PK club_id</text><text x="16" y="98" class="r">UQ club_name</text><text x="16" y="126" class="r">category, status</text><text x="16" y="154" class="r">logo, contact</text></g>
<g transform="translate(1185 105)"><rect width="290" height="195" class="box"/><path d="M0 0h290v42H0z" class="head"/><text x="16" y="28" class="h">ANNOUNCEMENT</text><text x="16" y="70" class="r">PK announcement_id</text><text x="16" y="98" class="r">FK publisher_user_id</text><text x="16" y="126" class="r">FK club_id (optional)</text><text x="16" y="154" class="r">type, expiry, status</text><text x="16" y="182" class="r">notified_at</text></g>
<g transform="translate(55 415)"><rect width="260" height="170" class="box"/><path d="M0 0h260v42H0z" class="head"/><text x="16" y="28" class="h">STUDENTS</text><text x="16" y="70" class="r">PK/FK user_id</text><text x="16" y="98" class="r">UQ student_number</text><text x="16" y="126" class="r">department</text><text x="16" y="154" class="r">academic year</text></g>
<g transform="translate(405 390)"><rect width="290" height="220" class="box"/><path d="M0 0h290v42H0z" class="head"/><text x="16" y="28" class="h">EVENT_REGISTRATION</text><text x="16" y="70" class="r">PK registration_id</text><text x="16" y="98" class="r">FK student_user_id</text><text x="16" y="126" class="r">FK event_id</text><text x="16" y="154" class="r">status, QR token</text><text x="16" y="182" class="r">cancellation reason</text><text x="16" y="210" class="r">UQ student + event</text></g>
<g transform="translate(790 415)"><rect width="260" height="170" class="box"/><path d="M0 0h260v42H0z" class="head"/><text x="16" y="28" class="h">EVENTS</text><text x="16" y="70" class="r">PK event_id</text><text x="16" y="98" class="r">FK club_id</text><text x="16" y="126" class="r">date, deadline</text><text x="16" y="154" class="r">capacity, status</text></g>
<g transform="translate(1185 415)"><rect width="290" height="170" class="box"/><path d="M0 0h290v42H0z" class="head"/><text x="16" y="28" class="h">NOTIFICATION</text><text x="16" y="70" class="r">PK notification_id</text><text x="16" y="98" class="r">FK recipient_user_id</text><text x="16" y="126" class="r">type, message</text><text x="16" y="154" class="r">is_read, created_at</text></g>
<g transform="translate(405 745)"><rect width="290" height="170" class="box"/><path d="M0 0h290v42H0z" class="head"/><text x="16" y="28" class="h">ATTENDANCE</text><text x="16" y="70" class="r">PK attendance_id</text><text x="16" y="98" class="r">UQ/FK registration_id</text><text x="16" y="126" class="r">status, method</text><text x="16" y="154" class="r">check-in time</text></g>
<g transform="translate(790 745)"><rect width="290" height="170" class="box"/><path d="M0 0h290v42H0z" class="head"/><text x="16" y="28" class="h">CERTIFICATE</text><text x="16" y="70" class="r">PK certificate_id</text><text x="16" y="98" class="r">UQ/FK attendance_id</text><text x="16" y="126" class="r">number, file</text><text x="16" y="154" class="r">verification, status</text></g>
<path d="M185 275V415" class="line"/><text x="198" y="355" class="label">1 : 0..1</text><path d="M315 190H405" class="line"/><text x="330" y="175" class="label">1 : N</text><path d="M695 190H790" class="line"/><text x="720" y="175" class="label">N : 1</text><path d="M920 275V415" class="line"/><text x="935" y="355" class="label">1 : N</text><path d="M315 500H405" class="line"/><text x="330" y="485" class="label">1 : N</text><path d="M695 500H790" class="line"/><text x="720" y="485" class="label">N : 1</text><path d="M550 610V745" class="line"/><text x="565" y="685" class="label">1 : 0..1</text><path d="M695 830H790" class="line"/><text x="718" y="815" class="label">1 : 0..1</text><path d="M315 235H1130V500H1185" class="line"/><text x="1090" y="485" class="label">1 : N</text><path d="M1050 190H1185" class="line"/><text x="1090" y="175" class="label">1 : N</text>
</svg>
