<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">CampusHub normalized relational schema</title><desc id="desc">Core entities and foreign-key relationships for users, clubs, memberships, events, registrations, attendance, certificates, feedback, announcements and notifications.</desc>
<defs><style>.h{font:700 22px Arial;fill:#fff}.r{font:400 17px Consolas,monospace;fill:#17212b}.box{fill:#fffaf2;stroke:#17212b;stroke-width:3;rx:12}.head{fill:#17212b}.line{stroke:#6a746e;stroke-width:3;fill:none}.label{font:700 15px Arial;fill:#bd4f3c}.title{font:700 26px Arial;fill:#17212b}</style></defs><rect width="1600" height="1000" fill="#f8f1e5"/><text x="50" y="52" class="title">NORMALIZED CORE SCHEMA</text>
<g transform="translate(50 90)"><rect width="280" height="190" class="box"/><path d="M0 0h280v42H0z" class="head"/><text x="18" y="29" class="h">USERS</text><text x="18" y="72" class="r">PK user_id</text><text x="18" y="101" class="r">UQ email</text><text x="18" y="130" class="r">password_hash</text><text x="18" y="159" class="r">role, status</text></g>
<g transform="translate(50 370)"><rect width="280" height="165" class="box"/><path d="M0 0h280v42H0z" class="head"/><text x="18" y="29" class="h">STUDENTS</text><text x="18" y="72" class="r">PK/FK user_id</text><text x="18" y="101" class="r">UQ student_number</text><text x="18" y="130" class="r">department, year</text></g>
<g transform="translate(430 90)"><rect width="330" height="230" class="box"/><path d="M0 0h330v42H0z" class="head"/><text x="18" y="29" class="h">CLUB_MEMBERSHIP</text><text x="18" y="72" class="r">PK membership_id</text><text x="18" y="101" class="r">FK student_user_id</text><text x="18" y="130" class="r">FK club_id</text><text x="18" y="159" class="r">member_role</text><text x="18" y="188" class="r">approval + status</text></g>
<g transform="translate(880 90)"><rect width="280" height="190" class="box"/><path d="M0 0h280v42H0z" class="head"/><text x="18" y="29" class="h">CLUBS</text><text x="18" y="72" class="r">PK club_id</text><text x="18" y="101" class="r">UQ club_name</text><text x="18" y="130" class="r">category, status</text><text x="18" y="159" class="r">logo, contact</text></g>
<g transform="translate(1280 90)"><rect width="270" height="165" class="box"/><path d="M0 0h270v42H0z" class="head"/><text x="18" y="29" class="h">GALLERY</text><text x="18" y="72" class="r">PK photo_id</text><text x="18" y="101" class="r">FK club_id</text><text x="18" y="130" class="r">path, caption</text></g>
<g transform="translate(880 390)"><rect width="330" height="245" class="box"/><path d="M0 0h330v42H0z" class="head"/><text x="18" y="29" class="h">EVENTS</text><text x="18" y="72" class="r">PK event_id</text><text x="18" y="101" class="r">FK club_id</text><text x="18" y="130" class="r">FK created_by_user_id</text><text x="18" y="159" class="r">date + deadline</text><text x="18" y="188" class="r">capacity + status</text><text x="18" y="217" class="r">venue, poster</text></g>
<g transform="translate(430 400)"><rect width="340" height="235" class="box"/><path d="M0 0h340v42H0z" class="head"/><text x="18" y="29" class="h">EVENT_REGISTRATION</text><text x="18" y="72" class="r">PK registration_id</text><text x="18" y="101" class="r">FK student_user_id</text><text x="18" y="130" class="r">FK event_id</text><text x="18" y="159" class="r">status + qr_token</text><text x="18" y="188" class="r">cancellation_reason</text></g>
<g transform="translate(50 700)"><rect width="280" height="180" class="box"/><path d="M0 0h280v42H0z" class="head"/><text x="18" y="29" class="h">NOTIFICATION</text><text x="18" y="72" class="r">PK notification_id</text><text x="18" y="101" class="r">FK recipient_user_id</text><text x="18" y="130" class="r">type, message</text><text x="18" y="159" class="r">is_read</text></g>
<g transform="translate(430 735)"><rect width="280" height="175" class="box"/><path d="M0 0h280v42H0z" class="head"/><text x="18" y="29" class="h">ATTENDANCE</text><text x="18" y="72" class="r">PK attendance_id</text><text x="18" y="101" class="r">UQ/FK registration_id</text><text x="18" y="130" class="r">status, method</text></g>
<g transform="translate(830 740)"><rect width="300" height="175" class="box"/><path d="M0 0h300v42H0z" class="head"/><text x="18" y="29" class="h">CERTIFICATE</text><text x="18" y="72" class="r">PK certificate_id</text><text x="18" y="101" class="r">UQ/FK attendance_id</text><text x="18" y="130" class="r">numbers + file</text></g>
<g transform="translate(1250 740)"><rect width="300" height="175" class="box"/><path d="M0 0h300v42H0z" class="head"/><text x="18" y="29" class="h">FEEDBACK</text><text x="18" y="72" class="r">PK feedback_id</text><text x="18" y="101" class="r">UQ/FK registration_id</text><text x="18" y="130" class="r">rating, review</text></g>
<path d="M190 280V370" class="line"/><text x="205" y="335" class="label">1 : 0..1</text><path d="M330 170H430" class="line"/><text x="350" y="155" class="label">1 : N</text><path d="M760 170H880" class="line"/><text x="790" y="155" class="label">N : 1</text><path d="M1160 170H1280" class="line"/><text x="1190" y="155" class="label">1 : N</text><path d="M1020 280V390" class="line"/><text x="1035" y="345" class="label">1 : N</text><path d="M770 510H880" class="line"/><text x="790" y="495" class="label">N : 1</text><path d="M190 535V610H600V400" class="line"/><text x="300" y="600" class="label">student 1 : N registrations</text><path d="M600 635V735" class="line"/><text x="615" y="690" class="label">1 : 0..1</text><path d="M710 825H830" class="line"/><text x="740" y="810" class="label">1 : 0..1</text><path d="M770 590H1180V740H1250" class="line"/><text x="1000" y="575" class="label">registration 1 : 0..1 feedback</text><path d="M50 790H20V185H50" class="line"/><text x="25" y="660" class="label">1:N</text>
</svg>
