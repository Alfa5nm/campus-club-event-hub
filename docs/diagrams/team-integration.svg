<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Team feature integration</title><desc id="desc">Diha's authority enables events, Rifat verifies participation and certificates, and Faisal publishes recipient-specific engagement updates.</desc><defs><style>.b{stroke:#17212b;stroke-width:3;rx:20}.h{font:700 27px Arial;fill:#17212b}.s{font:400 18px Arial;fill:#46515a}.k{font:700 15px Arial;letter-spacing:2px;fill:#bd4f3c}.l{stroke:#17212b;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#17212b"/></marker></defs><rect width="1500" height="720" fill="#f8f1e5"/><text x="60" y="65" class="k">THREE OWNERS / ONE RELATIONAL WORKFLOW</text>
<rect x="60" y="150" width="390" height="360" fill="#f4b83f" class="b"/><text x="95" y="210" class="h">Tarannum Diha</text><text x="95" y="250" class="s">Club profiles</text><text x="95" y="284" class="s">Membership approval</text><text x="95" y="318" class="s">Executive role assignment</text><text x="95" y="352" class="s">Event CRUD</text><path d="M95 395H415" stroke="#17212b" stroke-width="2"/><text x="95" y="435" class="s">Output:</text><text x="95" y="469" class="h">authorized events</text>
<rect x="555" y="150" width="390" height="360" fill="#ee725d" class="b"/><text x="590" y="210" class="h">Rifat Mahmud</text><text x="590" y="250" class="s">QR registration passes</text><text x="590" y="284" class="s">Attendance check-in</text><text x="590" y="318" class="s">Certificate lifecycle</text><text x="590" y="352" class="s">Public verification</text><path d="M590 395H910" stroke="#17212b" stroke-width="2"/><text x="590" y="435" class="s">Output:</text><text x="590" y="469" class="h">verified participation</text>
<rect x="1050" y="150" width="390" height="360" fill="#dce8dc" class="b"/><text x="1085" y="210" class="h">Faisal Mahbub</text><text x="1085" y="250" class="s">Publishing desk</text><text x="1085" y="284" class="s">Notification inbox</text><text x="1085" y="318" class="s">One-time fan-out</text><text x="1085" y="352" class="s">Role-aware dashboards</text><path d="M1085 395H1405" stroke="#17212b" stroke-width="2"/><text x="1085" y="435" class="s">Output:</text><text x="1085" y="469" class="h">insight + engagement</text>
<path d="M450 330H545M945 330H1040" class="l"/><text x="60" y="610" class="h">Authority → event → QR attendance → certificate → notification</text><text x="60" y="650" class="s">Each feature is independently demonstrable, but the strongest presentation follows the complete chain.</text>
</svg>
